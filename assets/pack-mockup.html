<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack mockup</title>
<!--
  mshmsh-visual-design pack mockup. Copy to .design-options/<nn-pack>/mockup.html next to the flat
  panel artwork (PNG, JPG or SVG, one file per panel) and edit only the CONFIG block.
    box: w x h x d in mm (front width, height, depth), panels front / back / left / right / top / bottom
    jar: diameter and height in mm, a flat label image wrapped around it, and lid / body colours
  Items show side by side, so a whole range is judged as a block. Drag sideways (or use the arrow
  keys) to turn them; B shows the back. It is a mockup, labelled as one: the physical prototype
  and the printer's proof still decide.
  Shoot it:  node <skill>/scripts/shoot.mjs mockup.html <outDir> --sizes=1200x900 --name=pack
-->
<script>
/* ===== CONFIG: edit this block ===== */
const TITLE = "Hawraman Honey: range";
const VIEW = { turn: -32, tilt: -16, side: "right" };   // side: "right" for Latin-led packs, "left" for Kurdish/Arabic-led
const BACKGROUND = "#EDEAE3";
const ITEMS = [
  { type: "box", name: "Gift box", w: 90, h: 120, d: 90,
    panels: { front: "box-front.png", right: "box-side.png", left: "box-side.png", top: "box-top.png", back: "box-back.png" },
    colour: "#3B2410" },
  { type: "jar", name: "Jar 500 g", diameter: 85, height: 100, label: "jar-label.png", labelHeight: 62, labelBottom: 16,
    labelArc: 300, body: "#C98A1C", lid: "#2A1A0B", lidHeight: 18 },
  // optional on any item: spin (degrees) to turn it on its own; jars face their label front by default
];
/* ===== end CONFIG ===== */
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1b1b1a; }
  header { position: absolute; inset-inline: 0; top: 0; padding: 16px 22px; display: flex; justify-content: space-between; align-items: baseline; z-index: 2; }
  h1 { margin: 0; font-size: 18px; font-weight: 650; }
  .tag { font-size: 12px; border: 1px solid currentColor; border-radius: 99px; padding: 1px 10px; opacity: 0.7; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 7vw; padding: 80px 40px 60px; flex-wrap: wrap; perspective: 1700px; cursor: grab; user-select: none; }
  figure { margin: 0; display: grid; justify-items: center; gap: 26px; }
  figcaption { font-size: 13px; opacity: 0.75; }
  .holder { position: relative; display: grid; place-items: center; }
  .shadow { position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%); border-radius: 50%;
            background: radial-gradient(closest-side, rgba(0,0,0,0.28), rgba(0,0,0,0)); filter: blur(4px); }
  .obj { position: relative; transform-style: preserve-3d; }
  .face { position: absolute; left: 50%; top: 50%; background-size: 100% 100%; background-repeat: no-repeat; backface-visibility: hidden; }
  .face::after { content: ""; position: absolute; inset: 0; background: var(--shade, transparent); }
  .strip { position: absolute; left: 50%; top: 50%; backface-visibility: hidden; background-repeat: no-repeat; }
  .disc { position: absolute; left: 50%; top: 50%; border-radius: 50%; }
  .hint { position: absolute; bottom: 14px; inset-inline: 0; text-align: center; font-size: 12px; opacity: 0.55; }
</style>
</head>
<body>
<header><h1 id="title"></h1><span class="tag">Mockup</span></header>
<main id="stage"></main>
<div class="hint">Drag or use the arrow keys to turn. B shows the back.</div>
<script>
  document.body.style.background = BACKGROUND;
  document.getElementById("title").textContent = TITLE;
  document.title = TITLE;
  const stage = document.getElementById("stage");
  const STAGE_PX = Math.min(380, window.innerHeight * 0.48);
  const tallest = Math.max(...ITEMS.map(i => i.type === "jar" ? i.height + (i.lidHeight || 0) : i.h));
  const k = STAGE_PX / tallest;                 // px per mm, the same for every item so sizes compare
  let turn = VIEW.side === "left" ? Math.abs(VIEW.turn) : -Math.abs(VIEW.turn);
  const tilt = VIEW.tilt;
  const objs = [];
  const startTurn = turn;

  function face(w, h, transform, panel, colour, shade) {
    const f = document.createElement("div");
    f.className = "face";
    f.style.width = w + "px"; f.style.height = h + "px";
    f.style.marginLeft = -w / 2 + "px"; f.style.marginTop = -h / 2 + "px";
    f.style.transform = transform;
    f.style.backgroundColor = colour || "#ccc";
    if (panel) f.style.backgroundImage = `url("${panel}")`;
    if (shade) f.style.setProperty("--shade", shade);
    return f;
  }

  function box(it) {
    const W = it.w * k, H = it.h * k, D = it.d * k, p = it.panels || {};
    const o = document.createElement("div");
    o.className = "obj"; o.style.width = W + "px"; o.style.height = H + "px";
    o.appendChild(face(W, H, `translateZ(${D / 2}px)`, p.front, it.colour));
    o.appendChild(face(W, H, `rotateY(180deg) translateZ(${D / 2}px)`, p.back, it.colour, "rgba(0,0,0,0.10)"));
    o.appendChild(face(D, H, `rotateY(90deg) translateZ(${W / 2}px)`, p.right, it.colour, "rgba(0,0,0,0.16)"));
    o.appendChild(face(D, H, `rotateY(-90deg) translateZ(${W / 2}px)`, p.left, it.colour, "rgba(0,0,0,0.16)"));
    o.appendChild(face(W, D, `rotateX(90deg) translateZ(${H / 2}px)`, p.top, it.colour, "rgba(255,255,255,0.10)"));
    o.appendChild(face(W, D, `rotateX(-90deg) translateZ(${H / 2}px)`, p.bottom, it.colour, "rgba(0,0,0,0.25)"));
    return { el: o, w: W, h: H, depth: D };
  }

  function jar(it) {
    const Dm = it.diameter * k, R = Dm / 2, Hb = it.height * k, Hl = (it.lidHeight || 0) * k;
    const total = Hb + Hl, N = 56, arc = Math.min(it.labelArc || 360, 360);
    const stripW = Math.PI * Dm / N + 0.8;
    const labelW = Math.PI * Dm * arc / 360, labelH = (it.labelHeight || it.height * 0.6) * k;
    const labelBottom = (it.labelBottom || 0) * k;
    const o = document.createElement("div");
    o.className = "obj"; o.style.width = Dm + "px"; o.style.height = total + "px";
    const light = a => 0.62 + 0.38 * Math.max(0, Math.cos((a + 35) * Math.PI / 180));
    for (let i = 0; i < N; i++) {
      const a = -180 + (i + 0.5) * 360 / N;
      // body strip
      const b = document.createElement("div");
      b.className = "strip";
      b.style.width = stripW + "px"; b.style.height = Hb + "px";
      b.style.marginLeft = -stripW / 2 + "px"; b.style.marginTop = (-total / 2 + Hl) + "px";
      b.style.background = it.body || "#c8c4bb";
      b.style.transform = `rotateY(${a}deg) translateZ(${R}px)`;
      b.style.filter = `brightness(${light(a).toFixed(3)})`;
      o.appendChild(b);
      // label strip, only inside the label's arc, centred on the front
      if (it.label && Math.abs(a) <= arc / 2) {
        const u = (a - 180 / N + arc / 2) / arc;
        const l = document.createElement("div");
        l.className = "strip";
        l.style.width = stripW + "px"; l.style.height = labelH + "px";
        l.style.marginLeft = -stripW / 2 + "px";
        l.style.marginTop = (-total / 2 + Hl + Hb - labelBottom - labelH) + "px";
        l.style.backgroundImage = `url("${it.label}")`;
        l.style.backgroundSize = `${labelW}px ${labelH}px`;
        l.style.backgroundPosition = `${-u * labelW}px 0`;
        l.style.transform = `rotateY(${a}deg) translateZ(${R + 0.6}px)`;
        l.style.filter = `brightness(${light(a).toFixed(3)})`;
        o.appendChild(l);
      }
      // lid strip
      if (Hl) {
        const d = document.createElement("div");
        d.className = "strip";
        d.style.width = stripW * 1.03 + "px"; d.style.height = Hl + "px";
        d.style.marginLeft = -stripW * 1.03 / 2 + "px"; d.style.marginTop = -total / 2 + "px";
        d.style.background = it.lid || "#333";
        d.style.transform = `rotateY(${a}deg) translateZ(${R * 1.03}px)`;
        d.style.filter = `brightness(${light(a).toFixed(3)})`;
        o.appendChild(d);
      }
    }
    const top = document.createElement("div");
    top.className = "disc";
    const tr = Hl ? R * 1.03 : R;
    top.style.width = top.style.height = 2 * tr + "px";
    top.style.marginLeft = top.style.marginTop = -tr + "px";
    top.style.background = Hl ? (it.lid || "#333") : (it.body || "#c8c4bb");
    top.style.filter = "brightness(1.08)";
    top.style.transform = `rotateX(90deg) translateZ(${total / 2}px)`;
    o.appendChild(top);
    return { el: o, w: Dm, h: total, depth: Dm };
  }

  ITEMS.forEach(it => {
    const fig = document.createElement("figure");
    const holder = document.createElement("div");
    holder.className = "holder";
    const made = it.type === "jar" ? jar(it) : box(it);
    holder.style.width = Math.max(made.w, made.depth) * 1.35 + "px";
    holder.style.height = made.h * 1.15 + "px";
    const sh = document.createElement("div");
    sh.className = "shadow";
    sh.style.width = Math.max(made.w, made.depth) * 1.5 + "px";
    sh.style.height = Math.max(made.w, made.depth) * 0.45 + "px";
    holder.appendChild(sh);
    holder.appendChild(made.el);
    fig.appendChild(holder);
    const cap = document.createElement("figcaption");
    cap.textContent = it.type === "jar" ? `${it.name} · ø${it.diameter} x ${it.height} mm` : `${it.name} · ${it.w} x ${it.h} x ${it.d} mm`;
    fig.appendChild(cap);
    stage.appendChild(fig);
    const spin = it.spin !== undefined ? it.spin : (it.type === "jar" ? -startTurn : 0);
    objs.push({ el: made.el, spin });
  });

  function apply() { objs.forEach(o => { o.el.style.transform = `rotateX(${tilt}deg) rotateY(${turn + o.spin}deg)`; }); }
  apply();
  let dragging = false, lastX = 0;
  stage.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; stage.setPointerCapture(e.pointerId); stage.style.cursor = "grabbing"; });
  stage.addEventListener("pointermove", e => { if (!dragging) return; turn += (e.clientX - lastX) * 0.4; lastX = e.clientX; apply(); });
  stage.addEventListener("pointerup", () => { dragging = false; stage.style.cursor = "grab"; });
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { turn -= 10; apply(); }
    else if (e.key === "ArrowRight") { turn += 10; apply(); }
    else if (e.key.toLowerCase() === "b") { turn += 180; apply(); }
  });
</script>
</body>
</html>
